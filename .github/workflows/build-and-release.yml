name: Build and Release

# Fires when a version tag is pushed. Two jobs, so that no code but our own and GitHub's official
# actions runs in the job that can write the release and the update channel:
#   build   (contents: read)   tests, reproducible XPI build, hands the XPI over as an artifact;
#   release (contents: write)  checks the hash, attests build provenance, publishes the release
#                              (XPI + provenance bundle) and the update manifest on gh-pages.
# The "release" environment is protected in the repository settings (required reviewer).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      xpi: ${{ steps.build.outputs.xpi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Verify the tag is on main and matches package.json and the manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::Tag ${REF_NAME} is not on main; refusing to release it."; exit 1; }
          TAG="${REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          MAN="$(node -p "require('./extension/manifest.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MAN" ]; then
            echo "::error::Tag ${REF_NAME}, package.json ${PKG} and manifest ${MAN} must all agree."
            exit 1
          fi

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: node --test test/*.cjs

      - name: Build the XPI (reproducible)
        id: build
        run: |
          set -euo pipefail
          node scripts/build-xpi-reproducible.cjs
          XPI="$(ls dist/commonpost-mcp-v*.xpi)"
          echo "xpi=$(basename "$XPI")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$XPI" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep the XPI for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpi
          path: dist/*.xpi
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # create the release; update updates.json on gh-pages through the API
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Download the XPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xpi
          path: dist

      - name: Check the XPI is the one the build job hashed
        env:
          XPI: ${{ needs.build.outputs.xpi }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ "$(ls dist | wc -l)" = "1" ]
          printf '%s  dist/%s\n' "$EXPECTED" "$XPI" | sha256sum -c -

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.xpi }}

      - name: Create the GitHub release (XPI + provenance bundle)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          XPI: ${{ needs.build.outputs.xpi }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/${XPI}.sigstore.json"
          VER="${TAG#v}"
          awk -v v="$VER" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for ${VER}"; exit 1; }
          gh release create "$TAG" "dist/${XPI}" "dist/${XPI}.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the update manifest to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          XPI: ${{ needs.build.outputs.xpi }}
          HASH: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${XPI}"
          TMP_ASSET="$(mktemp)"
          downloaded=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$ASSET_URL" -o "$TMP_ASSET" &&
              printf '%s  %s\n' "$HASH" "$TMP_ASSET" | sha256sum -c -; then
              downloaded=1
              break
            fi
            echo "Release asset not ready or hash mismatch on attempt ${attempt}; retrying..."
            sleep 5
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Release asset ${ASSET_URL} was not downloadable with sha256 ${HASH}."
            exit 1
          fi
          TAG="$TAG" VER="$VER" HASH="$HASH" node scripts/gen-updates.js > updates.json
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/updates.json?ref=gh-pages" --jq .sha 2>/dev/null || true)"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/updates.json" \
            -f message="Update Commonpost MCP update manifest for ${TAG}" \
            -f branch=gh-pages \
            -f content="$(base64 -w0 updates.json)" \
            ${CURRENT_SHA:+-f sha="$CURRENT_SHA"}
