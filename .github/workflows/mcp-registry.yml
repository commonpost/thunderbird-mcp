name: MCP Registry

# Publishes the listing io.github.commonpost/thunderbird-mcp on the official MCP Registry for a published release:
# the .mcpb of that release, with its SHA-256. Called by Build and Release once the release is published, or run by
# hand from main for an existing tag (RELEASING.md). The registry grants the io.github.commonpost namespace to this
# repository's GitHub OIDC token, so no secret is stored; that token could publish any io.github.commonpost/*
# listing, so the job runs in the "mcp-registry" environment, limited to main and the protected v*.*.* tags. Only GitHub's preinstalled gh and jq and the registry's signed mcp-publisher (pinned
# by hash) run here.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to list (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to list (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the MCP Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read # gh release download and gh attestation verify of this repository
      id-token: write # GitHub OIDC token for mcp-publisher login github-oidc
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # mcp-publisher is signed with a plain Sigstore bundle, not a GitHub attestation. This hash was checked with
      # cosign verify-blob --new-bundle-format against release.yml@refs/tags/v1.8.7 of modelcontextprotocol/registry;
      # check the new archive the same way before changing the version.
      PUBLISHER_VERSION: v1.8.7
      PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - name: Write server.json for the release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          mkdir dl
          gh release download "$TAG" --pattern '*.mcpb' --dir dl
          shopt -s nullglob
          files=(dl/*.mcpb)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one .mcpb in $TAG"; exit 1; }
          mcpb="$(basename "${files[0]}")"
          gh attestation verify "dl/$mcpb" --repo "$GH_REPO"
          sha="$(sha256sum "dl/$mcpb" | cut -d' ' -f1)"
          jq -n --arg version "${TAG#v}" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$mcpb" --arg sha "$sha" '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: "io.github.commonpost/thunderbird-mcp",
            title: "Commonpost MCP for Thunderbird",
            description: "Mail, contacts, calendar and filters of Thunderbird for AI assistants, through a local add-on.",
            version: $version,
            websiteUrl: "https://github.com/commonpost/thunderbird-mcp",
            repository: { url: "https://github.com/commonpost/thunderbird-mcp", source: "github" },
            packages: [ { registryType: "mcpb", identifier: $url, fileSha256: $sha, transport: { type: "stdio" } } ]
          }' > server.json
          cat server.json

      - name: Install mcp-publisher (pinned hash)
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          echo "$PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
