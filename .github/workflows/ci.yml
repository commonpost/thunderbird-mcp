name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      # No runtime dependencies; the dev dependencies (fast-check, eslint) come from the committed lockfile.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint

  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      - name: Assert package.json and manifest versions match
        run: |
          PKG="$(node -p "require('./package.json').version")"
          MAN="$(node -p "require('./extension/manifest.json').version")"
          if [ "$PKG" != "$MAN" ]; then
            echo "::error::package.json version ($PKG) does not match extension/manifest.json version ($MAN). They must stay in lockstep."
            exit 1
          fi
          echo "Versions in sync: $PKG"
